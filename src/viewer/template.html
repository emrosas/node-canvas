<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="generator" content="node-canvas" />
    <title>{{title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
    />
    <style>
{{css}}
    </style>
  </head>
  <body>
    <header class="bar" data-bar>
      <a class="brand" href="#" data-about title="About this map">
        {{logo}}
        <span class="brand-text">
          <span class="brand-title" data-map-title></span>
          <span class="brand-sub" data-map-sub></span>
        </span>
      </a>

      <div class="facets" role="tablist" aria-label="Color notes by" data-facets></div>

      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
          <input type="search" placeholder="Search notes" data-search aria-label="Search notes" />
          <kbd>/</kbd>
        </label>
        <button class="chip" type="button" data-attention-toggle aria-pressed="false">
          <span class="chip-dot attention"></span>
          Needs attention <span class="count" data-attention-count></span>
        </button>
        <button class="chip" type="button" data-labels-toggle aria-pressed="false">Link labels</button>
        <span class="audience" data-audience></span>
        <nav class="views" data-views aria-label="Switch view" hidden></nav>
      </div>
    </header>

    <main class="viewport" data-viewport>
      <div class="world" data-world>
        <div class="bands" data-bands></div>
        <svg class="edges" data-edges></svg>
        <div class="nodes" data-nodes></div>
        <div class="edge-labels" data-edge-labels></div>
      </div>
      <div class="col-heads" data-col-heads></div>
      <div class="row-heads" data-row-heads></div>
    </main>

    <aside class="legend" data-legend></aside>

    <div class="zoom">
      <button type="button" data-zoom="-1" aria-label="Zoom out">−</button>
      <button type="button" data-zoom-fit class="zoom-level" data-zoom-level aria-label="Fit to screen">100%</button>
      <button type="button" data-zoom="1" aria-label="Zoom in">+</button>
    </div>

    <aside class="panel" data-panel aria-hidden="true">
      <button class="panel-close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
      </button>
      <div class="panel-body" data-panel-body></div>
    </aside>

    <script type="application/json" id="map-data">{{data}}</script>
    <script>
{{js}}
    </script>
    {{reload}}
  </body>
</html>
